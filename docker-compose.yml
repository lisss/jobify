services:
  db:
    image: postgres:16-alpine
    container_name: jobify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobify
      POSTGRES_PASSWORD: jobify
      POSTGRES_DB: jobify
    ports:
      - "5432:5432"
    volumes:
      - jobify_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobify -d jobify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobify_pgdata:
